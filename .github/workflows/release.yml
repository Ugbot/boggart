name: release

# Builds the two binaries -- boggart (CLI) and boggart-studio (desktop) -- for
# Linux, macOS and Windows, and packages each into an archive you can download.
#
# ci.yml proves the code compiles and passes its suites. This file exists to
# produce something a person can actually run, which is a different job with
# different failure modes: a binary that builds fine on a runner is useless if
# it cannot find its Lua at startup, or if it links a library that only exists
# on the machine that built it. Both of those are handled below and both are
# the reason this is not just "upload build/boggart".
#
# Triggered by pushing a tag (v0.1.0, v1.2.3) which also publishes a GitHub
# Release, or by hand from the Actions tab, which builds and uploads the
# archives without releasing anything.
#
# ONE FILE. Each archive holds two executables and nothing else -- no data
# directory, no SDL3.dll, no "install SDL3 first". Two things make that true:
#
#   studio/data (sixty-odd Lua files and three fonts) is baked into
#   boggart-studio by tools/bake_assets.cmake, so it has no tree to find.
#
#   SDL3 is built from source as a static library by CMakeLists.txt itself and
#   linked in, so this workflow installs nothing to get it. The
#   package-manager route cannot give us this: Homebrew's `sdl2` is really
#   sdl2-compat, a shim that dlopen()s SDL3 from an absolute Cellar path, so a
#   binary linked against it fails on any machine without Homebrew.
#
# What is still dynamic is the platform's own: libc, and on macOS the Cocoa /
# Metal / Security frameworks. curl, ncurses, SDL, FreeType and mbedTLS are
# fetched and linked statically. A fully static Linux binary (musl, no glibc)
# is a different job and is not what these archives are.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest on purpose: a binary is linked against the
          # glibc it was built on and runs on that version or newer, never
          # older. Building on the oldest image GitHub still offers is what
          # makes the download work on more than the newest Ubuntu.
          - target: linux-x86_64
            os: ubuntu-22.04
          # Apple silicon and Intel are separate binaries. macos-14 and later
          # are arm64 runners; macos-13 is the last x86_64 one.
          - target: macos-arm64
            os: macos-14
          - target: macos-x86_64
            os: macos-13
          - target: windows-x86_64
            os: windows-latest

    steps:
      # Before checkout, so it governs the checkout: Git for Windows would
      # otherwise convert every .lua file to CRLF, and tools/bake_embedded.cmake
      # bakes bytes. See the same step in ci.yml.
      - name: Check out with LF line endings (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # The newest released CMake and Ninja on every platform, rather than
      # whatever each runner image happens to ship -- those drift apart by
      # years between images, and "works on the Linux runner, fails on the
      # Windows one" is nearly always a version difference. This also replaces
      # the three separate ninja installs the matrix would otherwise need.
      - name: CMake and Ninja
        uses: lukka/get-cmake@latest

      # Linux still needs the C-side dependencies that are not vendored.
      # SDL3 is not among them any more -- CMakeLists.txt fetches and builds it.
      #
      # It does, however, need the X11 and Wayland *headers*, and this list not
      # having them was a real bug in the release: SDL configures cleanly
      # without them, builds only its dummy and offscreen video drivers, and
      # produces a boggart-studio that starts, initialises SDL, opens nothing
      # and appears to hang. Verified by building this file's old package list
      # in a container and enumerating SDL_GetVideoDriver: offscreen, dummy,
      # evdev. Every name below is annotated in ci.yml, which asserts the
      # outcome; the same assertion runs here.
      - name: Install deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev

      # Puts cl.exe, the CRT/SDK headers and the linker on PATH. Without it
      # Ninja has no compiler on windows-latest. x64 is explicit because the
      # default host/target pairing has changed between runner images, and a
      # 32-bit cl runs out of heap on embedded.c.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same cache, same three paths, same reasoning as ci.yml -- including the
      # two ninja log files, without which the cache restores and then rebuilds
      # everything anyway. The key carries the build type because this workflow
      # builds Release and ci.yml builds RelWithDebInfo, and one set of objects
      # must not be handed to the other.
      - name: Cache the SDL3/libcurl build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: rel-${{ matrix.os }}-sdl3.4.14-curl8.20.0-${{ hashFiles('CMakeLists.txt') }}

      # ---- build -------------------------------------------------------------
      # Release, not the project's RelWithDebInfo default: this is the build
      # people download, so it should be the small one. ci.yml still exercises
      # the default.
      #
      # No `shell:` here or below. The commands are the same three words on
      # every platform, so they run in each runner's own default shell -- bash
      # on Unix, PowerShell on Windows -- rather than pushing Windows through
      # Git Bash, where MSYS rewrites anything that looks like a POSIX path in
      # an argument. Nothing here needs a POSIX shell.
      #
      # If a restored cache is unusable it fails *configure*, so try once and
      # then configure clean. A genuine error fails both attempts.
      - name: Configure
        id: configure
        continue-on-error: true
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure again, without the cache
        if: steps.configure.outcome == 'failure'
        run: |
          cmake -E rm -rf build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # The one thing about this binary that no later step can see: whether SDL
      # compiled a video driver that can open a window. It is asserted against
      # SDL_config.h, which is the file SDL's own compile read.
      - name: Video drivers (linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          h=$(find build/_deps/sdl3-build -name SDL_config.h -path '*include-config*' | head -1)
          test -n "$h" || { echo "no SDL_config.h -- did SDL build from source?"; exit 1; }
          for d in X11 WAYLAND; do
            grep -q "^#define SDL_VIDEO_DRIVER_$d 1" "$h" || {
              echo "SDL built without the $d video driver: this release would"
              echo "ship a studio that cannot open a window. Refusing to package."
              exit 1
            }
          done
          echo "SDL video drivers: x11, wayland"

      # A release that has not been tested is not worth publishing, and these
      # suites are headless -- ui-check and ui-bench need a window server and
      # deliberately are not ctest, so they cannot run here.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ---- package -----------------------------------------------------------
      # Just the two executables. studio/data is baked into boggart-studio, so
      # there is no tree to ship and nothing that can be left behind when
      # someone moves the binary out of the folder they unpacked.
      #
      # CMakeLists.txt writes both binaries to the source root, not into
      # build/, which is why they are collected from there.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          test -x ./boggart        || { echo "boggart was not built"; exit 1; }
          test -x ./boggart-studio || { echo "boggart-studio was not built -- SDL3 missing?"; exit 1; }
          name="boggart-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp boggart boggart-studio "dist/$name/"
          cp README.md "dist/$name/" 2>/dev/null || true
          # The licence ships WITH the binaries: BSL 1.1 requires this licence
          # to be displayed on every copy, and the third-party notices it carries
          # must travel with the work they cover.
          cp LICENSE "dist/$name/"
          cp studio/LICENSE-lite studio/LICENSE-rough "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ./boggart.exe))        { throw "boggart.exe was not built" }
          if (-not (Test-Path ./boggart-studio.exe)) { throw "boggart-studio.exe was not built -- SDL3 missing?" }
          $tag  = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA }
          $name = "boggart-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item boggart.exe, boggart-studio.exe "dist/$name/"
          Copy-Item README.md "dist/$name/" -ErrorAction SilentlyContinue
          # Same on Windows: BSL 1.1 requires the licence on every copy.
          Copy-Item LICENSE "dist/$name/"
          Copy-Item studio/LICENSE-lite, studio/LICENSE-rough "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          "ARCHIVE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Smoke-test what is actually in the archive rather than what is in the
      # build tree: this is the step that catches a missing data/ directory or
      # a binary that cannot find its own libraries.
      # Run what is actually in the archive, not what is in the build tree.
      # This is the step that catches a missing data/ directory or a binary
      # that cannot find its own libraries -- neither of which the Build or
      # Test steps above can see, because both run against the source tree with
      # every dependency already in place.
      #
      # `--eval <file>` rather than a --version flag: boggart has no --version,
      # and an unrecognised argument falls through to the interactive banner,
      # which exits 0 without having proved anything. Evaluating a script
      # exercises the embedded Lua and the C bindings it is wrapped around.
      - name: Smoke-test the package (unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          d=$(mktemp -d); tar -C "$d" -xzf "$ARCHIVE"
          p=$(echo "$d"/boggart-*)
          cat > "$d/smoke.lua" <<'LUA'
          assert(sys.width("日本語") == 6, "width tables missing from the package")
          assert(bog.version, "the harness did not load")
          io.write("packaged boggart ok, version ", bog.version, "\n")
          LUA
          HOME=$(mktemp -d) "$p/boggart" --eval "$d/smoke.lua"
          # The studio has to run with nothing beside it. Copied alone into an
          # empty directory, because running it from the unpacked archive would
          # still find a data/ tree if one had crept back in.
          solo=$(mktemp -d); cp "$p/boggart-studio" "$solo/"
          test -z "$(ls -A "$solo" | grep -v boggart-studio)" || { echo "not a single file"; exit 1; }
          ldd "$solo/boggart-studio" 2>/dev/null | grep -Ei 'libsdl|libcurl' && { echo "studio still has a third-party dylib"; exit 1; }
          otool -L "$solo/boggart-studio" 2>/dev/null | grep -Ei 'libsdl|libcurl' && { echo "studio still has a third-party dylib"; exit 1; }
          ldd "$p/boggart" 2>/dev/null | grep -Ei 'libcurl|libncurses|libform' && { echo "cli still has a third-party dylib"; exit 1; }
          otool -L "$p/boggart" 2>/dev/null | grep -Ei 'libcurl|libncurses|libform' && { echo "cli still has a third-party dylib"; exit 1; }
          echo "boggart-studio is one file"; true

      - name: Smoke-test the package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive "$env:ARCHIVE" -DestinationPath $d -Force
          $p = (Get-ChildItem $d -Directory)[0].FullName
          # An array of single-quoted lines rather than a here-string: PowerShell
          # requires the closing '@ to sit in column 0, which cannot happen
          # inside a YAML block scalar without ending the block.
          #
          # The ideograph is written as a Lua \u escape so this file stays
          # ASCII and no encoding decision (BOM, code page, Set-Content default)
          # can change what the test actually asserts.
          $lua = Join-Path $d "smoke.lua"
          Set-Content -Path $lua -Encoding utf8 -Value @(
            'assert(sys.width("\u{65e5}\u{672c}\u{8a9e}") == 6, "width tables missing")',
            'assert(bog.version, "the harness did not load")',
            'io.write("packaged boggart ok, version ", bog.version, "\n")'
          )
          & "$p\boggart.exe" --eval $lua
          if ($LASTEXITCODE -ne 0) { throw "packaged boggart.exe did not run" }
          # One file: the archive must contain the two exes and nothing else.
          if (Test-Path "$p\SDL3.dll") { throw "SDL3.dll should not be needed any more" }
          if (Test-Path "$p\libcurl.dll") { throw "libcurl.dll should be statically linked" }
          if (Test-Path "$p\data")     { throw "data/ should be baked into the exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Separate job so a release is only cut once every platform has built and
  # tested. A partial release -- Linux published, Windows still red -- is worse
  # than no release, because the tag looks done.
  publish:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
