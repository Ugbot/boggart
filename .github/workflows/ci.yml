name: ci

# Three platforms, one recipe: configure with Ninja, build, ctest.
#
# Windows is the reason this file exists. The project was written on macOS, so
# the windows-latest job is the native MSVC compile that keeps the POSIX
# assumptions out -- it has caught real ones. All three platforms have been
# green since src/lsys.c and src/lmcp.c finished moving onto src/sysproc.h;
# fail-fast is off so one red platform does not hide the state of the others.
#
# boggart-studio is actually built on every platform here. It was not, for most
# of this project's life: nothing installed SDL, so CMakeLists.txt printed
# "SDL3 not found -- skipping boggart-studio"
# and carries on green, which meant the whole studio -- renderer, font
# fallback, the SDL event loop -- compiled nowhere but a developer's Mac.
# `ninja ui-check` and `ui-bench` still cannot run here: they need a window
# server, which is also why they are not ctest suites.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A job that hangs -- a test waiting on stdin, a runner that loses the
    # network mid-fetch -- otherwise burns six hours of the account's minutes
    # before GitHub kills it. A cold build here is under fifteen.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (gcc)
            os: ubuntu-latest
          - name: macos (appleclang)
            os: macos-latest
          - name: windows (msvc)
            os: windows-latest

    steps:
      # Before checkout, so it governs the checkout. Git for Windows defaults
      # to core.autocrlf=true, which would hand the Windows job CRLF copies of
      # every .lua file -- baked verbatim into embedded.c by
      # tools/bake_embedded.cmake, since file(READ ... HEX) is byte-exact. Lua
      # itself does not care, but it means the Windows binary is not built from
      # the same bytes as the other two, and any test that compares source text
      # would fail on one platform for a reason that has nothing to do with the
      # code. The fonts are safe either way (git detects them as binary); this
      # is about making all three platforms byte-identical.
      - name: Check out with LF line endings (windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # ---- toolchain -------------------------------------------------------
      # The newest released CMake and Ninja, rather than whatever each runner
      # image ships. The images drift apart by years, and CI that builds with
      # three different CMake versions is CI that reports three different
      # things. This installs both, so no per-platform ninja step is needed.
      - name: CMake and Ninja
        uses: lukka/get-cmake@latest

      # SDL3 is no longer installed anywhere: CMakeLists.txt fetches and builds
      # it from source and links it statically, so what CI compiles is what a
      # release ships. What Linux still needs is the X11 and Wayland *headers*
      # SDL compiles its video backends against. Without them SDL configures
      # cleanly, builds a dummy video driver, and produces a binary that cannot
      # open a window -- a failure that appears at run time on a user's machine
      # rather than here, which is the worst place for it. The "Video drivers"
      # step below asserts the result rather than trusting this list.
      #
      # Every name here was checked against SDL 2.32.10's own configure summary,
      # in a container, one group at a time, and kept for 3.4.14 because the
      # X11/Wayland feature flags have the same -dev packages:
      #
      #   libx11-dev                     SDL_X11. On its own it is not enough:
      #                                  SDL then hard-errors on the missing
      #                                  Xext.h rather than quietly going on.
      #   libxext-dev ... libxss-dev     the X11 sub-features (XDBE, XShape,
      #                                  XCursor, XRandR, XInput2, XFixes,
      #                                  XScrnSaver). Each one silently off
      #                                  without its -dev package.
      #   libxkbcommon-dev, libwayland-dev, wayland-protocols
      #                                  SDL_WAYLAND. All three, or it is off.
      #   libdecor-0-dev                 client-side window decorations on
      #                                  Wayland. Without it the studio's window
      #                                  has no titlebar and cannot be resized
      #                                  on GNOME, which ships no server-side
      #                                  decorations.
      #   libgl-dev libegl-dev           SDL_OPENGL / GLX. Spelled this way and
      #                                  not libegl1-mesa-dev because that is a
      #                                  transitional package on 24.04 whose
      #                                  dependency on libgl-dev is the only
      #                                  reason OpenGL was being detected at
      #                                  all -- an accident to depend on.
      #
      # python3 is not a build dependency: tests/mcp.lua drives a mock MCP
      # server written in Python over stdio. The runner images happen to ship
      # it, which is exactly the kind of accident that works until an image
      # changes -- a Docker run without it fails only the mcp suite, which
      # reads like an MCP bug rather than a missing interpreter.
      #
      # curl, ncurses and SDL are fetched and built statically by CMake.
      # The -dev packages below are SDL's video backends, not our runtime.
      - name: Install deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev

      # macOS and Windows need nothing: SDL's backends there are system
      # frameworks and Win32 APIs whose headers ship with the SDK.

      # Puts cl.exe, the CRT/SDK headers and the linker on PATH for every
      # later step. Without this, Ninja has no compiler on windows-latest --
      # the MSVC toolchain is only reachable through a vcvars environment.
      # x64 is explicit: the default host/target pairing has changed between
      # runner images before, and a 32-bit cl would run out of heap on
      # embedded.c (a ~1.4 MB single translation unit of byte-array
      # initialisers).
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- the dependency cache --------------------------------------------
      # SDL3, libcurl and (on Unix) mbedTLS/ncurses are built from source: about
      # four hundred translation units that are pinned by version and SHA256
      # and therefore produce the same objects every time. Rebuilding them on
      # every push is most of what this workflow costs.
      #
      # The three paths are not arbitrary, and the two log files are the whole
      # trick -- this was measured, in Docker, by restoring a cache into a
      # clean tree and counting what ninja rebuilt:
      #
      #   build/_deps       the fetched sources and their object files.
      #   build/.ninja_log  without it ninja has no record of the command line
      #                     that produced each object, calls it "not in the
      #                     log" and rebuilds all of it.
      #   build/.ninja_deps the header dependencies. Without *this* one every
      #                     object is "deps are missing" and, again, all of it
      #                     rebuilds -- a cache that restores perfectly and
      #                     saves nothing at all.
      #
      # With all three: 0 of 202 SDL objects recompiled, 320 build steps down
      # to 116. CMakeCache.txt is deliberately *not* cached, so every run still
      # configures from scratch against whatever compiler the image now has.
      #
      # The key pins both versions and hashes CMakeLists.txt, since that is
      # where their build options live. No restore-keys: a near-miss cache is
      # worth less than a correct build, and the retry below handles the rest.
      - name: Cache the SDL3/libcurl build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/.ninja_log
            build/.ninja_deps
          key: deps-${{ matrix.os }}-sdl3.4.14-curl8.20.0-${{ hashFiles('CMakeLists.txt') }}

      # ---- build -----------------------------------------------------------
      # No -DCMAKE_BUILD_TYPE: the project defaults to RelWithDebInfo when it
      # is unset, and CI should exercise that default.
      #
      # This also fetches libcurl 8.20.0 (Schannel on Windows, mbedTLS
      # elsewhere; see CMakeLists.txt). On a cold cache the first configure
      # therefore needs network access and takes a couple of minutes longer.
      #
      # The restored cache records the absolute path it was built at, which is
      # constant per runner OS -- but a half-written or otherwise unusable one
      # fails *configure*, not the build, and that failure is indistinguishable
      # from a broken CMakeLists.txt in the log. So: try once, and if it fails,
      # throw the cache away and configure clean. A genuine error fails both.
      - name: Configure
        id: configure
        continue-on-error: true
        run: cmake -B build -G Ninja

      - name: Configure again, without the cache
        if: steps.configure.outcome == 'failure'
        run: |
          cmake -E rm -rf build
          cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      # The X11 trap, asserted rather than assumed. SDL_config.h is the file
      # its own compile actually read, so this is the built artifact talking
      # and not a repetition of the apt list above. If either driver is missing
      # the studio still builds and still links -- it just cannot open a window
      # on any normal desktop, and nothing else in this workflow would notice.
      - name: Video drivers (linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          h=$(find build/_deps/sdl3-build -name SDL_config.h -path '*include-config*' | head -1)
          test -n "$h" || { echo "no SDL_config.h -- did SDL build from source?"; exit 1; }
          for d in X11 WAYLAND; do
            grep -q "^#define SDL_VIDEO_DRIVER_$d 1" "$h" || {
              echo "SDL built without the $d video driver."
              echo "The studio would ship with only the dummy/offscreen drivers"
              echo "and could not open a window. Check the apt list above."
              exit 1
            }
          done
          grep -q '^#define SDL_VIDEO_DRIVER_X11_XRANDR 1' "$h" || {
            echo "X11 is present but XRandR is not: no display-mode handling."; exit 1; }
          echo "SDL video drivers: x11, wayland"

      - name: Test
        run: ctest --test-dir build --output-on-failure
