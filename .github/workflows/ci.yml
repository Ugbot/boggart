name: ci

# Three platforms, one recipe: configure with Ninja, build, ctest.
#
# Windows is the reason this file exists. The project was written on macOS, so
# the windows-latest job is the native MSVC compile that keeps the POSIX
# assumptions out -- it has caught real ones. All three platforms have been
# green since src/lsys.c and src/lmcp.c finished moving onto src/sysproc.h;
# fail-fast is off so one red platform does not hide the state of the others.
#
# SDL2 is installed on every platform so boggart-studio is actually built.
# Without it CMakeLists.txt prints "SDL2 not found -- skipping boggart-studio"
# and carries on green, which meant the whole studio -- renderer, font
# fallback, the SDL event loop -- compiled nowhere but a developer's Mac.
# `ninja ui-check` and `ui-bench` still cannot run here: they need a window
# server, which is also why they are not ctest suites.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux (gcc)
            os: ubuntu-latest
          - name: macos (appleclang)
            os: macos-latest
          - name: windows (msvc)
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      # ---- toolchain -------------------------------------------------------
      # The newest released CMake and Ninja, rather than whatever each runner
      # image ships. The images drift apart by years, and CI that builds with
      # three different CMake versions is CI that reports three different
      # things. This installs both, so no per-platform ninja step is needed.
      - name: CMake and Ninja
        uses: lukka/get-cmake@latest

      # Linux deps: libcurl is found with find_package(CURL REQUIRED), ncurses
      # with find_package(Curses REQUIRED) + CURSES_NEED_NCURSES, and SDL2 with
      # find_package(SDL2) against the sdl2-config.cmake that libsdl2-dev
      # installs. libncurses-dev is the modern name and ships the wide
      # (ncursesw) libraries too; libncursesw5-dev is now only a transitional
      # alias.
      - name: Install deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libncurses-dev libsdl2-dev

      # Homebrew's `sdl2` is really sdl2-compat, a shim over SDL3. That is fine
      # for compiling and running here; it is only a problem for redistributing
      # a binary, which release.yml documents.
      - name: Install deps (macos)
        if: runner.os == 'macOS'
        run: brew install sdl2

      # The official SDL2 development package ships cmake/, so pointing
      # SDL2_DIR at it is all find_package(SDL2) needs. There is no system SDL2
      # on Windows and no reliable package-manager one.
      - name: Install deps (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = '2.32.10'
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$ver/SDL2-devel-$ver-VC.zip"
          Invoke-WebRequest -Uri $url -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath $env:RUNNER_TEMP\sdl2
          "SDL2_DIR=$env:RUNNER_TEMP\sdl2\SDL2-$ver\cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Puts cl.exe, the CRT/SDK headers and the linker on PATH for every
      # later step. Without this, Ninja has no compiler on windows-latest --
      # the MSVC toolchain is only reachable through a vcvars environment.
      # x64 is explicit: the default host/target pairing has changed between
      # runner images before, and a 32-bit cl would run out of heap on
      # embedded.c (a ~1.4 MB single translation unit of byte-array
      # initialisers).
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---- build -----------------------------------------------------------
      # No -DCMAKE_BUILD_TYPE: the project defaults to RelWithDebInfo when it
      # is unset, and CI should exercise that default.
      #
      # On Windows this also fetches and builds libcurl 8.20.0 with the
      # Schannel backend (see CMakeLists.txt); the first configure therefore
      # needs network access and takes about a minute longer.
      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
